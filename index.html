<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày 20/10 🌸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(225, 75, 120, 0.3);
      max-width: 450px;
      text-align: center;
      z-index: 10;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .icon-heart {
      font-size: 50px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .title {
      color: #d63384;
      font-size: 28px;
      margin: 15px 0 5px;
    }

    .subtitle {
      color: #6c757d;
      font-size: 16px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .message {
      color: #444;
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
    }

    .falling-element {
      position: absolute;
      top: -10%;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 1; }
      100% { top: 105%; transform: translateX(100px) rotate(360deg); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-heart">🌸</div>
    <h1 class="title">Chúc Mừng 20/10</h1>
    <p class="subtitle">Ngày Phụ Nữ Việt Nam</p>
    <div class="message">
      <p>Chúc bạn/mẹ/chị luôn xinh đẹp, rạng rỡ, tràn ngập niềm vui và hạnh phúc không chỉ hôm nay mà trong suốt 365 ngày! ✨</p>
    </div>
    <button id="btnClick" class="btn">Nhấn vào đây để nhận bất ngờ 💐</button>
  </div>

  <script>
    function createFallingItems() {
      const items = ['🌸', '🌷', '💖', '🌺', '✨', '🌹'];
      const container = document.body;

      setInterval(() => {
        const item = document.createElement('div');
        item.classList.add('falling-element');
        item.innerText = items[Math.floor(Math.random() * items.length)];
        item.style.left = Math.random() * 100 + 'vw';
        item.style.fontSize = (Math.random() * 15 + 15) + 'px';
        item.style.animationDuration = (Math.random() * 4 + 3) + 's';
        container.appendChild(item);

        setTimeout(() => { item.remove(); }, 7000);
      }, 300);
    }

    createFallingItems();

    document.getElementById('btnClick').addEventListener('click', function() {
      for (let i = 0; i < 30; i++) {
        createBurstEmoji();
      }
      alert("💐 Chúc bạn luôn nở nụ cười rạng rỡ và có một ngày 20/10 tràn ngập tình yêu thương! 💐");
    });

    function createBurstEmoji() {
      const emojis = ['💖', '💐', '🎉', '🌸', '✨'];
      const elem = document.createElement('div');
      elem.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      elem.style.position = 'fixed';
      elem.style.left = '50%';
      elem.style.top = '50%';
      elem.style.fontSize = '30px';
      elem.style.pointerEvents = 'none';
      elem.style.transition = 'all 1s ease-out';
      elem.style.zIndex = '999';

      document.body.appendChild(elem);

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 200 + 100;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;

      setTimeout(() => {
        elem.style.transform = `translate(${x}px, ${y}px) scale(1.5)`;
        elem.style.opacity = '0';
      }, 10);

      setTimeout(() => { elem.remove(); }, 1000);
    }
  </script>
</body>
</html>
